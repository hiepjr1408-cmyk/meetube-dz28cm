name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Áp dụng bản Việt hoá
        run: |
          unzip -q -o meetube-vi-full.zip -d /tmp/vi
          cp -r /tmp/vi/meetube-main/. .
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobileDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MeeTube-debug
          path: mobile/build/outputs/apk/stmobile/debug/*.apk
          if-no-files-found: error
